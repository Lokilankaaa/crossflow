[package]
name = "crossflow-pairing-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Separate build workspace; native clients explicitly package its workers.
[workspace]

[dependencies]
anyhow = "1"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
crossflow = { path = "../../.." }
serde_json = "1"
