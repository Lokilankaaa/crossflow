[package]
name = "crossflow-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only C ABI for native Crossflow clients"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
crossflow = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

