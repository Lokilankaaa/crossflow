<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-label="Crossflow Quiet White Multi-Screen Full Mesh Showcase">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF1F8"/>
      <stop offset="50%" stop-color="#F6F7F4"/>
      <stop offset="100%" stop-color="#EAF2F1"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5264D9" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4F847C" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="screen1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6FD"/>
    </linearGradient>
    <linearGradient id="screen2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF7F5"/>
    </linearGradient>
    <linearGradient id="screen3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7F9"/>
    </linearGradient>
    <filter id="winShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E2430" flood-opacity="0.10"/>
    </filter>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E2430" flood-opacity="0.06"/>
    </filter>
    <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.28"/>
    </filter>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#D5D8D3"/>
    </pattern>
    <clipPath id="winClip">
      <rect x="24" y="20" width="992" height="496" rx="16"/>
    </clipPath>
  </defs>

  <!-- Outer Backdrop -->
  <rect width="1040" height="540" rx="22" fill="url(#bgGrad)"/>

  <!-- Main Quiet White App Window -->
  <g filter="url(#winShadow)">
    <rect x="24" y="20" width="992" height="496" rx="16" fill="#F8F8F5" stroke="#DDE0DA" stroke-width="1.2"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- Window Title Bar -->
    <rect x="24" y="20" width="992" height="48" fill="#FFFFFF"/>
    <line x1="24" y1="68" x2="1016" y2="68" stroke="#E3E5E1" stroke-width="1"/>

    <!-- Subtle Window Controls -->
    <circle cx="48" cy="44" r="5.5" fill="#E3E5E1"/>
    <circle cx="66" cy="44" r="5.5" fill="#E3E5E1"/>
    <circle cx="84" cy="44" r="5.5" fill="#E3E5E1"/>

    <!-- Title -->
    <text x="108" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="650" fill="#282A2E" letter-spacing="-0.2">Crossflow</text>
    <text x="184" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#696D75">Quiet White · Full Mesh</text>

    <!-- Status Pill (Top Right) -->
    <rect x="756" y="31" width="242" height="26" rx="13" fill="#EDF7F1" stroke="#CBE8D6" stroke-width="1"/>
    <circle cx="772" cy="44" r="4" fill="#187345"/>
    <text x="783" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#187345">3 Devices Online · Noise_NNpsk0</text>

    <!-- Left Sidebar -->
    <rect x="24" y="68" width="256" height="448" fill="#FFFFFF"/>
    <line x1="280" y1="68" x2="280" y2="516" stroke="#E3E5E1" stroke-width="1"/>

    <text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#696D75" letter-spacing="0.9">MESH DEVICES</text>

    <!-- Sidebar Device #1 -->
    <rect x="40" y="110" width="224" height="62" rx="10" fill="#EEF0FA" stroke="#C7CEF2" stroke-width="1"/>
    <rect x="52" y="122" width="24" height="19" rx="5.5" fill="#5264D9"/>
    <text x="64" y="135.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">#1</text>
    <text x="84" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="650" fill="#282A2E">Windows 11</text>
    <text x="52" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#696D75">2560 × 1440 · Local · UAC Service</text>

    <!-- Sidebar Device #2 -->
    <rect x="40" y="182" width="224" height="62" rx="10" fill="#F4FAF8" stroke="#BDDAD4" stroke-width="1"/>
    <rect x="52" y="194" width="24" height="19" rx="5.5" fill="#4F847C"/>
    <text x="64" y="207.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">#2</text>
    <text x="84" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="650" fill="#282A2E">MacBook Air</text>
    <circle cx="248" cy="204" r="4" fill="#187345"/>
    <text x="52" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#4F847C" font-weight="500">Active Focus · Direct Link · 0.4ms</text>

    <!-- Sidebar Device #3 -->
    <rect x="40" y="254" width="224" height="62" rx="10" fill="#F8F8F5" stroke="#E3E5E1" stroke-width="1"/>
    <rect x="52" y="266" width="24" height="19" rx="5.5" fill="#5D6472"/>
    <text x="64" y="279.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">#3</text>
    <text x="84" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="650" fill="#282A2E">Workstation</text>
    <circle cx="248" cy="276" r="4" fill="#187345"/>
    <text x="52" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#696D75">1920 × 1080 · Ethernet LAN</text>

    <!-- Sidebar Quick Status Panel -->
    <line x1="40" y1="336" x2="264" y2="336" stroke="#ECEEE9" stroke-width="1"/>
    <text x="44" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#696D75" letter-spacing="0.9">ACTIVE POLICIES</text>

    <rect x="40" y="372" width="224" height="122" rx="10" fill="#F8F8F5" stroke="#E3E5E1" stroke-width="1"/>
    <text x="54" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#282A2E">QuickJump</text>
    <text x="250" y="395" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#5264D9">Ctrl+Alt+M4/M5</text>
    <line x1="54" y1="407" x2="250" y2="407" stroke="#E8EAE5" stroke-width="1"/>

    <text x="54" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#282A2E">Clipboard &amp; Files</text>
    <text x="250" y="427" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#187345">Encrypted ON</text>
    <line x1="54" y1="439" x2="250" y2="439" stroke="#E8EAE5" stroke-width="1"/>

    <text x="54" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#282A2E">IME &amp; Caps Sync</text>
    <text x="250" y="459" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#187345">Bi-Directional</text>
    <line x1="54" y1="471" x2="250" y2="471" stroke="#E8EAE5" stroke-width="1"/>

    <text x="54" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#696D75">1:1 Keys · Gamepad Passthrough</text>

    <!-- Main Dot-Grid Canvas -->
    <rect x="280" y="68" width="736" height="448" fill="#F8F8F5"/>
    <rect x="280" y="68" width="736" height="448" fill="url(#dotGrid)" opacity="0.8"/>

    <!-- Canvas Header -->
    <text x="312" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700" fill="#282A2E" letter-spacing="-0.3">Multi-Screen Topology</text>
    <text x="312" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#696D75">Drag screens to snap edges · Press Ctrl+Alt+1..9 or Mouse4/Mouse5 to QuickJump</text>

    <!-- Screen #1: Windows 11 -->
    <g filter="url(#cardShadow)">
      <rect x="316" y="160" width="234" height="156" rx="12" fill="url(#screen1Bg)" stroke="#5264D9" stroke-width="2"/>
      <!-- Top-left badge #1 -->
      <rect x="330" y="174" width="28" height="22" rx="6" fill="#5264D9"/>
      <text x="344" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">#1</text>
      <text x="366" y="189.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">Windows 11</text>
      <text x="330" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#696D75">Primary · 2560 × 1440</text>
      <!-- Subtle mini window wireframe inside Screen 1 -->
      <rect x="330" y="232" width="112" height="66" rx="6" fill="#FFFFFF" stroke="#E0E4F5" stroke-width="1"/>
      <rect x="338" y="242" width="46" height="5" rx="2.5" fill="#D5DCFA"/>
      <rect x="338" y="253" width="84" height="4" rx="2" fill="#ECEFF9"/>
      <rect x="338" y="263" width="70" height="4" rx="2" fill="#ECEFF9"/>
      <rect x="338" y="273" width="54" height="4" rx="2" fill="#ECEFF9"/>
    </g>

    <!-- Screen #2: MacBook Air (Active Remote Focus) -->
    <g filter="url(#cardShadow)">
      <rect x="556" y="184" width="204" height="132" rx="12" fill="url(#screen2Bg)" stroke="#4F847C" stroke-width="2.2"/>
      <rect x="570" y="198" width="28" height="22" rx="6" fill="#4F847C"/>
      <text x="584" y="213" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">#2</text>
      <text x="606" y="213.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">MacBook Air</text>
      <text x="570" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#4F847C" font-weight="500">macOS · 1470 × 956</text>
      <!-- Active remote indicator -->
      <rect x="570" y="284" width="96" height="20" rx="10" fill="#E1F2EE"/>
      <circle cx="582" cy="294" r="3.5" fill="#187345"/>
      <text x="591" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="650" fill="#187345">Active Cursor</text>
    </g>

    <!-- Screen #3: Workstation Win -->
    <g filter="url(#cardShadow)">
      <rect x="766" y="170" width="218" height="146" rx="12" fill="url(#screen3Bg)" stroke="#9AA1AE" stroke-width="1.6"/>
      <rect x="780" y="184" width="28" height="22" rx="6" fill="#5D6472"/>
      <text x="794" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">#3</text>
      <text x="816" y="199.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">Workstation</text>
      <text x="780" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#696D75">Windows · 1920 × 1080</text>
      <rect x="780" y="244" width="128" height="54" rx="6" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1"/>
      <rect x="788" y="254" width="54" height="5" rx="2.5" fill="#E0E3E8"/>
      <rect x="788" y="265" width="96" height="4" rx="2" fill="#EFF1F4"/>
      <rect x="788" y="275" width="76" height="4" rx="2" fill="#EFF1F4"/>
    </g>

    <!-- Edge Seam Glow between #1 and #2 -->
    <line x1="553" y1="196" x2="553" y2="304" stroke="#2563EB" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

    <!-- Smooth Glowing Cursor Flow Path (#1 -> #2) -->
    <path d="M 468 272 C 516 272, 526 250, 566 250 C 606 250, 636 258, 676 268" fill="none" stroke="url(#flowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 5"/>
    <circle cx="468" cy="272" r="4.5" fill="#5264D9" opacity="0.7"/>

    <!-- Crisp Vector Cursor inside #2 -->
    <g transform="translate(674, 260)" filter="url(#cursorShadow)">
      <path d="M 2 2 L 2 24 L 8 18.5 L 13 28 L 16.5 26.2 L 11.5 16.8 L 19.5 16.5 Z" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Seam Caption Pill -->
    <rect x="478" y="340" width="336" height="30" rx="15" fill="#FFFFFF" stroke="#E3E5E1" stroke-width="1"/>
    <circle cx="496" cy="355" r="4" fill="#2563EB"/>
    <text x="508" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#282A2E">Seamless Edge Crossing  ·  &lt; 5 ms QuickJump</text>

    <!-- Bottom 4 Capability Pills -->
    <g transform="translate(312, 412)">
      <rect x="0" y="0" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#E3E5E1" stroke-width="1"/>
      <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#5264D9">REAL-TIME INPUT</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">1000 Hz Motion</text>
      <text x="14" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#696D75">TCP 24800 · NODELAY</text>

      <rect x="172" y="0" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#E3E5E1" stroke-width="1"/>
      <text x="186" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#4F847C">AUXILIARY STREAM</text>
      <text x="186" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">Clipboard &amp; Files</text>
      <text x="186" y="60" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#696D75">TCP 24801 · BLAKE2s</text>

      <rect x="344" y="0" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#E3E5E1" stroke-width="1"/>
      <text x="358" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#187345">PRIVILEGED INPUT</text>
      <text x="358" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">UAC &amp; Lock Screen</text>
      <text x="358" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#696D75">Optional Win Service</text>

      <rect x="516" y="0" width="160" height="72" rx="10" fill="#FFFFFF" stroke="#E3E5E1" stroke-width="1"/>
      <text x="530" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#282A2E">FULL KEYBOARD</text>
      <text x="530" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#282A2E">Media, Fn &amp; IME</text>
      <text x="530" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" fill="#696D75">Volume · F1–F24 · 1:1</text>
    </g>
  </g>
</svg>
